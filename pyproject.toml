[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "steppe-watch"
version = "0.2.0"
description = "Reproducible RGB change analysis for satellite image crops"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = ["numpy>=1.26,<3", "Pillow>=10,<13", "scipy>=1.12,<2", "streamlit>=1.50,<2"]

[project.optional-dependencies]
dev = ["ruff>=0.14,<0.18"]

[project.scripts]
steppe-watch = "change_watch.__main__:main"

[tool.setuptools.packages.find]
include = ["change_watch*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
